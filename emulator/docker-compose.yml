# Azure Service Bus Emulator + SQL Server (хранилище на емулатора).
# Стартиране:  docker compose up -d     (от папка emulator/)
name: exam-registration-servicebus

services:
  emulator:
    container_name: servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - ./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"   # AMQP - използва се от услугите
      - "5300:5300"   # Health / management endpoint
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      ACCEPT_EULA: "${ACCEPT_EULA}"
      SQL_WAIT_INTERVAL: "${SQL_WAIT_INTERVAL}"
    depends_on:
      - sqlserver
    networks:
      sb-emulator:
        aliases:
          - sb-emulator

  sqlserver:
    container_name: servicebus-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # на Apple Silicon се изпълнява през Rosetta
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    networks:
      sb-emulator:
        aliases:
          - sqlserver

networks:
  sb-emulator:
