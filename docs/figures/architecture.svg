<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Times New Roman, Times, serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="470" fill="#fff"/>

  <!-- Azure Service Bus Emulator -->
  <rect x="250" y="100" width="380" height="355" fill="none" stroke="#777" stroke-dasharray="6 4"/>
  <text x="440" y="122" text-anchor="middle" font-size="12" fill="#444">Azure Service Bus Emulator (Docker, localhost:5672)</text>

  <!-- Клиент -->
  <rect x="15" y="15" width="200" height="56" fill="#f2f2f2" stroke="#000"/>
  <text x="115" y="39" text-anchor="middle" font-weight="bold">Клиент</text>
  <text x="115" y="58" text-anchor="middle" font-size="12">.http файл / curl / тест</text>

  <!-- Api -->
  <rect x="15" y="125" width="200" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="115" y="152" text-anchor="middle" font-weight="bold">ExamRegistration.Api</text>
  <text x="115" y="170" text-anchor="middle" font-size="12">ASP.NET Core Minimal API</text>
  <text x="115" y="186" text-anchor="middle" font-size="12">JWT, :5080</text>
  <line x1="100" y1="71" x2="100" y2="123" stroke="#000" marker-end="url(#a)"/>
  <line x1="130" y1="123" x2="130" y2="73" stroke="#000" marker-end="url(#a)"/>
  <text x="94" y="101" text-anchor="end" font-size="12">POST + JWT</text>
  <text x="136" y="101" font-size="12">202 Accepted</text>

  <!-- queue + DLQ -->
  <rect x="270" y="135" width="170" height="56" fill="#f2f2f2" stroke="#000"/>
  <text x="355" y="158" text-anchor="middle" font-weight="bold">queue</text>
  <text x="355" y="177" text-anchor="middle">exam-registrations</text>
  <line x1="215" y1="163" x2="268" y2="163" stroke="#000" marker-end="url(#a)"/>
  <text x="241" y="156" text-anchor="middle" font-size="12">send</text>

  <rect x="465" y="135" width="150" height="56" fill="#fff" stroke="#000" stroke-dasharray="4 3"/>
  <text x="540" y="158" text-anchor="middle" font-weight="bold">dead-letter</text>
  <text x="540" y="177" text-anchor="middle" font-size="12">poison, MaxDeliveryCount</text>
  <line x1="440" y1="163" x2="463" y2="163" stroke="#000" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- Processor -->
  <rect x="15" y="255" width="200" height="62" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="115" y="280" text-anchor="middle" font-weight="bold">ExamRegistration.Processor</text>
  <text x="115" y="299" text-anchor="middle" font-size="12">срок, места, дубликат</text>
  <path d="M300,191 L300,272 L217,272" fill="none" stroke="#000" marker-end="url(#a)"/>
  <text x="306" y="232" font-size="12">receive (PeekLock)</text>
  <path d="M215,302 L355,302 L355,333" fill="none" stroke="#000" marker-end="url(#a)"/>
  <text x="362" y="296" font-size="12">publish</text>
  <text x="362" y="311" font-size="12">Accepted / Rejected</text>

  <!-- topic + subscriptions -->
  <rect x="270" y="335" width="170" height="56" fill="#f2f2f2" stroke="#000"/>
  <text x="355" y="358" text-anchor="middle" font-weight="bold">topic</text>
  <text x="355" y="377" text-anchor="middle">registration-events</text>
  <rect x="465" y="325" width="150" height="34" fill="#fff" stroke="#000"/>
  <text x="540" y="347" text-anchor="middle">sub: notifications</text>
  <rect x="465" y="375" width="150" height="34" fill="#fff" stroke="#000"/>
  <text x="540" y="397" text-anchor="middle">sub: audit</text>
  <line x1="440" y1="355" x2="463" y2="343" stroke="#000" marker-end="url(#a)"/>
  <line x1="440" y1="371" x2="463" y2="390" stroke="#000" marker-end="url(#a)"/>

  <!-- Notifier, тестове -->
  <rect x="655" y="314" width="195" height="56" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="752" y="338" text-anchor="middle" font-weight="bold">ExamRegistration.Notifier</text>
  <text x="752" y="356" text-anchor="middle" font-size="12">„имейл“ до студента</text>
  <rect x="655" y="378" width="195" height="40" fill="#f2f2f2" stroke="#000"/>
  <text x="752" y="403" text-anchor="middle">Интеграционни тестове</text>
  <line x1="615" y1="342" x2="653" y2="342" stroke="#000" marker-end="url(#a)"/>
  <line x1="615" y1="392" x2="653" y2="398" stroke="#000" marker-end="url(#a)"/>
</svg>
